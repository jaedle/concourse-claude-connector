version: '3'

tasks:
  default:
    deps: [ci]

  fmt:
    desc: Format go sources
    cmds:
      - go fmt ./...

  lint:
    desc: Run static analysis
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with the race detector (needs a C toolchain)
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race ./...

  test:e2e:
    desc: Run end-to-end tests
    cmds:
      - go test -tags e2e -count=1 ./test/e2e/...

  test:mcp:
    desc: Grade the mcp interface for agent usability
    cmds:
      - mkdir -p out
      - go run ./tools/mcpsnapshot > out/mcp-snapshot.json
      - npx -y mcpgrade@0.1.0 --snapshot out/mcp-snapshot.json --json --fail-on warn

  manage-dependencies:
    desc: Verify, tidy and vendor go dependencies
    cmds:
      - go mod verify
      - go mod tidy
      - go mod vendor

  build:
    desc: Build the connector binary
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags='-s -w' -o out/connector ./cmd/connector

  ci:
    desc: Run all verification steps
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: test:e2e
      - task: build
      - task: test:mcp

  release:
    desc: Create a release via semantic-release
    cmds:
      - npm clean-install
      - npx semantic-release

  release:publish:
    desc: Build and push the multi-platform docker image
    requires:
      vars: [VERSION]
    cmds:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker buildx build --push --platform linux/arm64,linux/amd64 -f build/package/Dockerfile --build-arg VERSION={{.VERSION}} -t jaedle/concourse-claude-connector:{{.VERSION}} -t jaedle/concourse-claude-connector:latest .
